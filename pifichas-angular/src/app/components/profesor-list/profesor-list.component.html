<div class="detail-page">
  
  <div class="detail-header">
    <div class="header-left">
      <div class="header-info">
        <h2>Gestión de Profesores</h2>
        <p class="group">Administración del claustro</p>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn-primary" (click)="mostrarFormulario = !mostrarFormulario">
        {{ mostrarFormulario ? 'Ver Listado' : '+ Añadir Profesor' }}
      </button>
      <button class="btn-back-header" routerLink="/home">Volver</button>
    </div>
  </div>

  <app-confirm-dialog
    [isOpen]="showConfirmDialog"
    [title]="confirmDialogTitle"
    [message]="confirmDialogMessage"
    [confirmText]="confirmButtonText"
    (confirmed)="onDialogConfirmed()"
    (cancelled)="onDialogCancelled()">
  </app-confirm-dialog>

  <div class="content-card">
    
    <div *ngIf="mostrarFormulario">
      <h3>Registrar Nuevo Profesor</h3>
      <div class="form-section">
        <div class="form-row">
          <label>Nombre Completo</label>
          <input type="text" [(ngModel)]="nuevoProfe.nombre" placeholder="Ej. Juan Pérez">
        </div>
        <div class="form-row">
          <label>Correo Electrónico</label>
          <input type="email" [(ngModel)]="nuevoProfe.email" placeholder="email@centro.com">
        </div>
        <div class="form-row">
          <label>Contraseña</label>
          <input type="password" [(ngModel)]="nuevoProfe.contrasenia" placeholder="********">
        </div>
      </div>
      <button class="btn-save" (click)="guardarProfesor()">Guardar Profesor</button>
    </div>

    <div *ngIf="!mostrarFormulario">
      <div *ngIf="cargando" class="loader-container">
        <div class="spinner"></div>
        <p>Cargando datos...</p>
      </div>

      <div class="table-scroll" *ngIf="!cargando && profesores.length > 0">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Alumnos</th>
              <th style="text-align: center;">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let profe of profesores">
              <td><strong>{{ profe.id }}</strong></td>
              <td>{{ profe.nombre }}</td>
              <td>{{ profe.email }}</td>
              <td><span class="badge">{{ profe.total_alumnos || 0 }} asignados</span></td>
              <td style="text-align: center;">
                <button class="btn-action btn-delete-minimal" (click)="eliminarProfe(profe.id, profe.nombre)">
                  <span class="close-icon">×</span> Eliminar
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div *ngIf="!cargando && profesores.length === 0" class="no-data">
        <p>No hay profesores registrados.</p>
      </div>
    </div>
  </div>
</div>
