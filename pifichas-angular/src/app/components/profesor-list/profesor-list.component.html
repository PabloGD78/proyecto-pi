<div class="home-page">
  <div class="page-header">
    <h1>Gestión de Profesores</h1>
    <div class="header-btns">
      <button class="btn-add-profe" (click)="mostrarFormulario = !mostrarFormulario">
        {{ mostrarFormulario ? '← Ver Lista' : '+ Añadir Profesor' }}
      </button>
      <button class="btn-report" routerLink="/home">Volver a Alumnos</button>
    </div>
  </div>

  <!-- MODAL CONFIRMACIÓN (CREAR / ELIMINAR / AVISOS) -->
  <app-confirm-dialog
    [isOpen]="showConfirmDialog"
    [title]="confirmDialogTitle"
    [message]="confirmDialogMessage"
    [confirmText]="confirmButtonText"
    (confirmed)="onDialogConfirmed()"
    (cancelled)="onDialogCancelled()">
  </app-confirm-dialog>

  <!-- FORMULARIO CREAR PROFESOR -->
  <div *ngIf="mostrarFormulario" class="form-container">
    <h2>Registrar Nuevo Profesor</h2>
    <div class="form-grid">
      <input type="text" [(ngModel)]="nuevoProfe.nombre" placeholder="Nombre completo" class="input-field">
      <input type="email" [(ngModel)]="nuevoProfe.email" placeholder="Correo electrónico" class="input-field">
      <input type="password" [(ngModel)]="nuevoProfe.contrasenia" placeholder="Contraseña inicial" class="input-field">
      <button class="btn-save" (click)="guardarProfesor()">💾 Guardar Profesor</button>
    </div>
  </div>

  <!-- LISTADO -->
  <div class="table-container" *ngIf="!mostrarFormulario">
    <div *ngIf="cargando" class="loading-text">Cargando profesores...</div>

    <table class="students-table" *ngIf="!cargando && profesores.length > 0">
      <thead>
        <tr class="table-header">
          <th>ID</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Alumnos a cargo</th>
          <th class="action-cell">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr class="table-row" *ngFor="let profe of profesores">
          <td>{{ profe.id }}</td>
          <td>{{ profe.nombre }}</td>
          <td>{{ profe.email }}</td>
          <td>
            <span class="badge-alumnos">
              {{ profe.total_alumnos || 0 }} alumnos
            </span>
          </td>
          <td class="action-cell">
            <button class="btn-delete" (click)="eliminarProfe(profe.id, profe.nombre)">
              🗑️ Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="!cargando && profesores.length === 0" class="no-results">
      No se han encontrado profesores activos.
    </div>
  </div>
</div>
